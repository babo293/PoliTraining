<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polarized Cycling Planner</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Gepolariseerde Trainingsplanner voor Wielrenners">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --accent-orange: #f97316;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 16px 0 24px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .summary-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: center;
            margin-bottom: 16px;
        }

        .stat-box {
            background-color: rgba(255, 255, 255, 0.03);
            padding: 10px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-val {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .progress-bar-container {
            height: 12px;
            background-color: var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
        }

        .bar-z1 {
            background-color: var(--accent-blue);
            height: 100%;
            transition: width 0.3s ease;
        }

        .bar-z3 {
            background-color: var(--accent-orange);
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-top: 6px;
        }

        .z1-txt { color: var(--accent-blue); font-weight: 600; }
        .z3-txt { color: var(--accent-orange); font-weight: 600; }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .day-input-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .day-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .hours-display {
            font-weight: bold;
            color: var(--accent-blue);
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-orange);
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
        }

        .workout-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .badge-z1 { background-color: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .badge-z3 { background-color: rgba(249, 115, 22, 0.15); color: var(--accent-orange); border: 1px solid var(--accent-orange); }
        .badge-rest { background-color: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px solid var(--text-muted); }

        .workout-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.3;
        }

        .pwa-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--accent-orange);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            margin-top: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }

        .pwa-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
        <h1>🚴 Polarized Cycling Planner</h1>
        <div class="subtitle">Dynamische 80/20 Trainingsverdeler</div>
    </header>

    <div class="summary-card">
        <div class="summary-grid">
            <div class="stat-box">
                <div class="stat-val" id="total-hours">0u</div>
                <div class="stat-lbl">Totaal Uren</div>
            </div>
            <div class="stat-box">
                <div class="stat-val z1-txt" id="z1-hours">0u</div>
                <div class="stat-lbl">Zone 1 (80%)</div>
            </div>
            <div class="stat-box">
                <div class="stat-val z3-txt" id="z3-hours">0u</div>
                <div class="stat-lbl">Zone 3 (20%)</div>
            </div>
        </div>

        <div class="progress-bar-container">
            <div class="bar-z1" id="bar-z1" style="width: 80%;"></div>
            <div class="bar-z3" id="bar-z3" style="width: 20%;"></div>
        </div>
        <div class="progress-labels">
            <span class="z1-txt" id="lbl-z1-pct">Zone 1: 80%</span>
            <span class="z3-txt" id="lbl-z3-pct">Zone 3: 20%</span>
        </div>
    </div>

    <div class="section-title">📅 Stel je beschikbare uren in</div>

    <div id="days-container"></div>

    <button class="pwa-btn" id="install-btn" style="display: none;">📱 Installeer op Telefoon</button>

    <script>
        const days = [
            { name: "Maandag", hours: 0 },
            { name: "Dinsdag", hours: 1.25 },
            { name: "Woensdag", hours: 0 },
            { name: "Donderdag", hours: 1.5 },
            { name: "Vrijdag", hours: 0 },
            { name: "Zaterdag", hours: 1.5 },
            { name: "Zondag", hours: 3.5 }
        ];

        function formatHours(h) {
            if (h === 0) return "Rustdag";
            const hrs = Math.floor(h);
            const mins = Math.round((h - hrs) * 60);
            if (hrs === 0) return `${mins}m`;
            if (mins === 0) return `${hrs}u`;
            return `${hrs}u ${mins}m`;
        }

        function calculateSchedule() {
            const totalHours = days.reduce((acc, d) => acc + d.hours, 0);
            
            // Find active days
            const activeDays = days.map((d, index) => ({ ...d, index })).filter(d => d.hours > 0);

            // Determine best day for Z3 (High Intensity Interval)
            // Priority: A weekday session of 1u-1.5u, ensuring recovery
            let z3Index = -1;
            if (activeDays.length > 0) {
                // Pick mid-week day if available, else first active day
                const midWeek = activeDays.find(d => d.index >= 1 && d.index <= 3 && d.hours >= 1);
                if (midWeek) {
                    z3Index = midWeek.index;
                } else {
                    z3Index = activeDays[0].index;
                }
            }

            let actualZ3Hours = 0;
            let actualZ1Hours = 0;

            days.forEach((day, i) => {
                const card = document.getElementById(`day-card-${i}`);
                const badge = document.getElementById(`badge-${i}`);
                const desc = document.getElementById(`desc-${i}`);
                const valDisplay = document.getElementById(`val-${i}`);

                valDisplay.innerText = formatHours(day.hours);

                if (day.hours === 0) {
                    badge.className = "workout-badge badge-rest";
                    badge.innerText = "Rustdag";
                    desc.innerText = "Geen training. Focus op herstel, voeding en slaap.";
                } else if (i === z3Index) {
                    // Zone 3 Interval Session
                    const z3TimeMinutes = Math.min(Math.round(totalHours * 0.20 * 60), 30); // Max 30m hard intensity
                    actualZ3Hours += z3TimeMinutes / 60;
                    actualZ1Hours += day.hours - (z3TimeMinutes / 60);

                    badge.className = "workout-badge badge-z3";
                    badge.innerText = `Zone 3 - Intensief (${day.hours}u)`;
                    desc.innerText = `🔥 VO2max Intervallen: 20m warming-up Z1 + 4x4m of 3x8m in Zone 3 (max bereik) met 3m herstel + cooling-down in Z1.`;
                } else {
                    // Zone 1 Endurance
                    actualZ1Hours += day.hours;
                    badge.className = "workout-badge badge-z1";
                    badge.innerText = `Zone 1 - Duur / Herstel (${day.hours}u)`;

                    if (z3Index !== -1 && Math.abs(i - z3Index) === 1) {
                        desc.innerText = `🧘 Actief Herstel: Blijf strikt in Zone 1. Praten moet moeiteloos gaan. Tegenwind of heuvels rustig opknabbelen.`;
                    } else if (day.hours >= 3) {
                        desc.innerText = `🚴 Lange Duurrit: Gestaag tempo in Zone 1. Bouw je aerobe basis en vetverbranding uit.`;
                    } else {
                        desc.innerText = `🚴 Rustige Duurtraining: Soepele omwentelingen (90+ RPM) in Zone 1. Spreektempo vasthouden.`;
                    }
                }
            });

            // Update Header Stats
            document.getElementById("total-hours").innerText = `${totalHours.toFixed(1)}u`;
            document.getElementById("z1-hours").innerText = `${actualZ1Hours.toFixed(1)}u`;
            document.getElementById("z3-hours").innerText = `${actualZ3Hours.toFixed(1)}u`;

            const z1Pct = totalHours > 0 ? Math.round((actualZ1Hours / totalHours) * 100) : 80;
            const z3Pct = totalHours > 0 ? 100 - z1Pct : 20;

            document.getElementById("bar-z1").style.width = `${z1Pct}%`;
            document.getElementById("bar-z3").style.width = `${z3Pct}%`;
            document.getElementById("lbl-z1-pct").innerText = `Zone 1: ${z1Pct}%`;
            document.getElementById("lbl-z3-pct").innerText = `Zone 3: ${z3Pct}%`;
        }

        function renderDays() {
            const container = document.getElementById("days-container");
            container.innerHTML = "";

            days.forEach((day, index) => {
                const card = document.createElement("div");
                card.className = "day-input-card";
                card.id = `day-card-${index}`;

                card.innerHTML = `
                    <div class="day-header">
                        <span class="day-name">${day.name}</span>
                        <span class="hours-display" id="val-${index}">${formatHours(day.hours)}</span>
                    </div>
                    <input type="range" min="0" max="5" step="0.25" value="${day.hours}" oninput="updateDayHours(${index}, this.value)">
                    <div>
                        <span class="workout-badge" id="badge-${index}">-</span>
                    </div>
                    <div class="workout-desc" id="desc-${index}">-</div>
                `;

                container.appendChild(card);
            });

            calculateSchedule();
        }

        function updateDayHours(index, val) {
            days[index].hours = parseFloat(val);
            calculateSchedule();
        }

        // PWA Installation handling
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('install-btn');
            btn.style.display = 'block';
            btn.addEventListener('click', () => {
                btn.style.display = 'none';
                deferredPrompt.prompt();
            });
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        document.addEventListener("DOMContentLoaded", renderDays);
    </script>
</body>
</html>
